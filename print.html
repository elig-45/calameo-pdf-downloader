<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imprimer le document Calaméo</title>
    <style>
      :root { color-scheme: light; font: 14px/1.45 system-ui, sans-serif; color: #202426; background: #f3f5f4; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: white; box-shadow: 0 1px 5px #0002; }
      #status { flex: 1; margin: 0; }
      #print-button { padding: 8px 13px; border: 0; border-radius: 7px; color: white; background: #252b2e; font: inherit; cursor: pointer; }
      #print-button[hidden] { display: none; }
      #pdf-preview { display: block; width: 100vw; height: calc(100vh - 52px); border: 0; background: #e1e5e3; }
      @media print {
        @page { margin: 0; }
        html, body { width: 100%; height: 100%; min-height: 0; background: white; }
        header { display: none; }
        #pdf-preview { position: fixed; inset: 0; width: 100%; height: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <p id="status" role="status" aria-live="polite">Préparation du PDF complet…</p>
      <button id="print-button" type="button" hidden>Imprimer le PDF</button>
    </header>
    <iframe id="pdf-preview" title="PDF complet de la publication" hidden></iframe>
    <script src="shared.js"></script>
    <script src="print.js"></script>
  </body>
</html>
