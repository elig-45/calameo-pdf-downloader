<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of exporting a complete publication</title>
  <desc id="desc">Three generic publication pages become one PDF while the reader remains open.</desc>
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e9dfcc"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#252b27" flood-opacity=".15"/></filter>
  </defs>
  <rect width="760" height="290" rx="6" fill="#eee8dc"/>
  <path d="M37 231h686" stroke="#c9c0b1" stroke-width="1"/>
  <g filter="url(#shadow)">
    <g transform="translate(68 62) rotate(-8 70 84)">
      <rect width="122" height="160" fill="url(#sheet)" stroke="#d6cbb9"/>
      <rect x="12" y="13" width="98" height="62" fill="#83917d"/><path d="M12 64l27-27 25 22 18-20 28 34H12z" fill="#5f705f"/>
      <rect x="12" y="88" width="62" height="5" fill="#a94c40"/><rect x="12" y="103" width="96" height="3" fill="#a8a193"/><rect x="12" y="114" width="88" height="3" fill="#a8a193"/><rect x="12" y="125" width="91" height="3" fill="#a8a193"/>
    </g>
    <g transform="translate(126 66) rotate(1 70 84)">
      <rect width="122" height="160" fill="url(#sheet)" stroke="#d6cbb9"/>
      <rect x="13" y="15" width="50" height="5" fill="#a94c40"/><rect x="13" y="31" width="96" height="3" fill="#a8a193"/><rect x="13" y="42" width="94" height="3" fill="#a8a193"/><rect x="13" y="53" width="86" height="3" fill="#a8a193"/><rect x="13" y="64" width="93" height="3" fill="#a8a193"/>
      <rect x="13" y="83" width="96" height="47" fill="#d4c8b3"/><path d="M13 119l26-23 19 17 21-20 30 37H13z" fill="#758674"/>
    </g>
    <g transform="translate(190 70) rotate(9 70 84)">
      <rect width="122" height="160" fill="url(#sheet)" stroke="#d6cbb9"/>
      <rect x="13" y="16" width="96" height="47" fill="#c6b89c"/><circle cx="81" cy="33" r="10" fill="#e6bd75"/><path d="M13 54l24-22 24 23 19-17 29 28H13z" fill="#738171"/>
      <rect x="13" y="78" width="72" height="5" fill="#a94c40"/><rect x="13" y="96" width="96" height="3" fill="#a8a193"/><rect x="13" y="107" width="88" height="3" fill="#a8a193"/><rect x="13" y="118" width="93" height="3" fill="#a8a193"/>
    </g>
  </g>
  <path d="M348 145h85" stroke="#a84b40" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="m425 137 10 8-10 8" fill="none" stroke="#a84b40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <path d="M496 71h112l42 42v108H496z" fill="#fffdf8" stroke="#d6cbb9"/>
    <path d="M608 71v43h42" fill="#eadfcd" stroke="#d6cbb9"/>
    <rect x="520" y="132" width="92" height="44" rx="4" fill="#ad4c41"/>
    <text x="566" y="160" fill="#fff8ed" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">PDF</text>
    <text x="552" y="193" fill="#303733" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">ALL PAGES</text>
  </g>
  <text x="185" y="258" fill="#687068" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" letter-spacing="1.3">PAGES FROM THE READER</text>
  <text x="565" y="258" fill="#687068" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle" letter-spacing="1.3">ONE COMPLETE FILE</text>
</svg>
