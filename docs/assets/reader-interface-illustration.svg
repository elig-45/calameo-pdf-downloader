<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of a digital publication reader and PDF download</title>
  <desc id="desc">A generic open magazine in a dark reader, with print and download controls and a ready PDF card.</desc>
